repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^src/mailfallback/static/vendor/'
      - id: end-of-file-fixer
        # vendored assets must stay byte-identical to upstream (sync_vendor.py --check)
        exclude: '^src/mailfallback/static/vendor/'
      - id: check-yaml
        args: ['--unsafe']
        # Helm chart templates are Go templates, not parseable YAML
        exclude: '^charts/.*/templates/'
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: 'tests/.*|\.lock$'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: alembic-drift
        name: Check Alembic migration drift
        entry: uv run pytest tests/test_alembic_sync.py -x -q
        language: system
        files: '(models\.py|alembic/versions/.*\.py)$'
        pass_filenames: false

      - id: lexicon-check
        name: lexicon-check (advisory)
        entry: scripts/lexicon-check.sh
        language: script
        files: '^(src/mailfallback/templates/.*\.html|src/mailfallback/routers/.*\.py)$'
        pass_filenames: false
        verbose: true
