<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#grad)"/>
  <!-- Envelope body -->
  <rect x="96" y="160" width="320" height="220" rx="20" fill="white" opacity="0.95"/>
  <!-- Envelope flap -->
  <path d="M96 180 L256 300 L416 180" fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <!-- Shield (fallback protection) -->
  <path d="M340 260 L340 320 Q340 370 390 395 Q440 370 440 320 L440 260 Q390 245 340 260Z" fill="url(#shield-grad)"/>
  <!-- Checkmark inside shield -->
  <polyline points="362,310 382,335 418,290" fill="none" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
