<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mailfallback{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .sync-idle { color: var(--pico-color-green-500); }
        .sync-syncing { color: var(--pico-color-amber-500); }
        .sync-error { color: var(--pico-color-red-500); }
        nav { margin-bottom: 2rem; }
        .icon-btn {
            background: none;
            border: 1px solid var(--pico-muted-border-color);
            padding: 0.4rem 0.6rem;
            border-radius: 0.375rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.85rem;
            margin: 0;
            width: auto;
        }
        .icon-btn:hover { background: var(--pico-secondary-background); }
        .icon-btn.danger { color: var(--pico-color-red-500); border-color: var(--pico-color-red-500); }
        .icon-btn.danger:hover { background: var(--pico-color-red-50, #fef2f2); }
        .icon-btn.primary { color: var(--pico-primary); border-color: var(--pico-primary); }
        .icon-btn.success { color: var(--pico-color-green-500); border-color: var(--pico-color-green-500); }
        .actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.15rem 0.5rem;
            border-radius: 1rem;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .badge-idle { background: #dcfce7; color: #166534; }
        .badge-syncing { background: #fef3c7; color: #92400e; }
        .badge-error { background: #fee2e2; color: #991b1b; }
        .badge-disabled { background: #f3f4f6; color: #6b7280; }
        .google-logo { height: 1.1em; vertical-align: middle; margin-right: 0.25rem; }
        .auth-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.15rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.8rem;
            background: #f3f4f6;
        }
        .email-text { color: var(--pico-muted-color); font-size: 0.9rem; }
    </style>
</head>
<body>
    <nav class="container">
        <ul>
            <li><strong><i data-lucide="mail-check" style="vertical-align: middle; margin-right: 0.3rem;"></i>Mailfallback</strong></li>
        </ul>
        <ul>
            {% if user %}
            <li><a href="/"><i data-lucide="layout-dashboard" style="width:16px;height:16px;vertical-align:middle;margin-right:0.2rem;"></i>Dashboard</a></li>
            <li><a href="/accounts/new"><i data-lucide="plus-circle" style="width:16px;height:16px;vertical-align:middle;margin-right:0.2rem;"></i>Add Account</a></li>
            {% if user.role.value == "admin" %}
            <li><a href="/admin/users"><i data-lucide="users" style="width:16px;height:16px;vertical-align:middle;margin-right:0.2rem;"></i>Users</a></li>
            <li><a href="/settings"><i data-lucide="settings" style="width:16px;height:16px;vertical-align:middle;margin-right:0.2rem;"></i>Settings</a></li>
            {% endif %}
            <li><a href="#" hx-post="/api/auth/logout" hx-target="body"><i data-lucide="log-out" style="width:16px;height:16px;vertical-align:middle;margin-right:0.2rem;"></i>{{ user.username }}</a></li>
            {% endif %}
        </ul>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
