<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MailFallBack{% endblock %}</title>
    <link rel="stylesheet" href="/static/vendor/pico.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/vendor/htmx.min.js"></script>
    <script src="/static/vendor/lucide.min.js"></script>
</head>
<body{% if not user %} class="login-page"{% endif %}>
    <header class="topbar" id="topbar">
        <button id="menu-toggle" aria-label="Menu">
            <i data-lucide="menu" class="icon-xl"></i>
        </button>
        <a href="/" class="no-underline"><strong class="brand-short">MFB</strong></a>
    </header>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <a href="/" class="no-underline">
                <i data-lucide="mail-check" class="icon-inline"></i>
                <strong class="brand-short">MailFallBack</strong>
            </a>
        </div>
        {% if user %}
        <nav class="sidebar-nav">
            <a href="/" {% if request.url.path == "/" %}class="active"{% endif %}><i data-lucide="home" class="icon-nav"></i>Dashboard</a>
            <a href="/accounts" {% if request.url.path.startswith("/accounts") %}class="active"{% endif %}><i data-lucide="mail" class="icon-nav"></i>Accounts</a>
            {% if webmail_url %}
            <a href="{{ webmail_url }}" target="_blank" rel="noopener"><i data-lucide="globe" class="icon-nav"></i>Webmail</a>
            {% endif %}
            {% if user.role.value == "admin" %}
            <div class="sidebar-label">Admin</div>
            <a href="/admin/users" {% if request.url.path.startswith("/admin/users") %}class="active"{% endif %}><i data-lucide="user-circle" class="icon-nav"></i>Users</a>
            <a href="/admin/stores" {% if request.url.path.startswith("/admin/stores") %}class="active"{% endif %}><i data-lucide="database" class="icon-nav"></i>Stores</a>
            <a href="/admin/groups" {% if request.url.path.startswith("/admin/groups") %}class="active"{% endif %}><i data-lucide="users-round" class="icon-nav"></i>Groups</a>
            <a href="/settings" {% if request.url.path == "/settings" %}class="active"{% endif %}><i data-lucide="sliders" class="icon-nav"></i>System</a>
            {% endif %}
            <hr>
            <a href="/profile" {% if request.url.path == "/profile" %}class="active"{% endif %}><i data-lucide="circle-user-round" class="icon-nav"></i>{{ user.username }}</a>
            <a href="#" hx-post="/api/auth/logout" hx-target="body"><i data-lucide="log-out" class="icon-nav"></i>Logout</a>
        </nav>
        {% endif %}
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="content container">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/js/app.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
