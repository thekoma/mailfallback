{% extends "base.html" %}
{% block title %}Login — MFB{% endblock %}
{% block content %}
<article class="container-narrow">
    <header class="text-center">
        <i data-lucide="mail-check" class="icon-hero"></i>
        <h2 class="mb-0">MailFallBack</h2>
        <small class="text-muted">Your email safety net</small>
    </header>
    {% if error %}
    <p class="alert-error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">Login</button>
    </form>
    {% if oidc_enabled %}
    <hr>
    <a href="/auth/oidc/login" role="button" class="secondary outline text-center w-full">Login with SSO</a>
    {% endif %}
</article>
{% endblock %}
