{% extends "base.html" %}
{% block title %}Audit Log — MFB{% endblock %}
{% block body_class %}page-wide page-ledger{% endblock %}
{% block content %}
<header class="page-head">
    <div class="page-head-text">
        <h1 class="page-title">Audit log</h1>
        <p class="page-summary num">Who did what, and when. Times in UTC.</p>
    </div>
</header>

<form class="audit-filters" hx-get="/admin/audit/table" hx-target="#audit-table-wrap" hx-push-url="true" aria-label="Filter the audit log">
    <div class="quick-add-row">
        <div>
            <label for="audit-user">User</label>
            <select id="audit-user" name="user" class="filter-control">
                <option value="">All users</option>
                {% for u in all_users %}
                <option value="{{ u.username }}" {% if filters.get('user') == u.username %}selected{% endif %}>{{ u.username }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="audit-action">Action</label>
            <select id="audit-action" name="action" class="filter-control">
                <option value="">All actions</option>
                {% for a in distinct_actions %}
                <option value="{{ a }}" {% if filters.get('action') == a %}selected{% endif %}>{{ get_action_label(a) }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="audit-date">
            <label for="audit-from">From</label>
            <input type="date" id="audit-from" name="from" value="{{ filters.get('from', '') }}">
        </div>
        <div class="audit-date">
            <label for="audit-to">To</label>
            <input type="date" id="audit-to" name="to" value="{{ filters.get('to', '') }}">
        </div>
        <button type="submit" class="icon-btn primary" title="Filter"><i data-lucide="filter" class="icon-md"></i> Filter</button>
    </div>
</form>

<div id="audit-table-wrap">
    {% include "partials/audit_table.html" %}
</div>
{% endblock %}
