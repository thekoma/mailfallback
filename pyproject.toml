[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailfallback"
version = "0.1.0"
description = "Self-hosted email backup service wrapping mbsync"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "bcrypt>=4.2",
    "cryptography>=44.0",
    "apscheduler>=3.10,<4",
    "prometheus-client>=0.21",
    "authlib>=1.4",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "dnspython>=2.7",
    "defusedxml>=0.7",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = [
    "B008",  # Depends() in defaults is standard FastAPI pattern
    "S104",  # bind to 0.0.0.0 is intentional for containers
    "S105",  # hardcoded password defaults are documented as change-me
    "S106",  # same
    "S603",  # subprocess calls are intentional (mbsync execution)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S108", "S110"]
