[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailfallback"
version = "0.1.0"
description = "Self-hosted email backup service wrapping mbsync"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "bcrypt>=4.2",
    "cryptography>=44.0",
    "apscheduler>=3.10,<4",
    "prometheus-client>=0.21",
    "authlib>=1.4",
    "httpx>=0.28",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
