# -- MailFallBack application image
image:
  repository: ghcr.io/thekoma/mailfallback
  # -- defaults to the chart appVersion when empty
  tag: ""

# -- External hostname of the MFB UI (used by route.enabled and NOTES)
hostname: ""

# -- Existing Secrets holding the environment (the chart NEVER renders secret material).
# Required keys are listed in NOTES.txt / README.
existingSecrets:
  # -- envFrom for the app AND dovecot containers (DB, crypto, dovecot API key, SSO, providers)
  app: mailfallback-env
  # -- envFrom for roundcube (ROUNDCUBEMAIL_*); required when webmail.enabled
  roundcube: roundcube-env

# -- Opt-in alternative to existingSecrets: the chart renders the Secrets from
# these values. Vault-pointer strings (e.g. "${vault:secret/data/x#key}") pass
# through verbatim; use annotations for webhook/vaultsync integration.
# WITHOUT a vault webhook or SOPS, these values land in git, `helm get values`
# and the Helm release Secret — prefer existingSecrets for plaintext setups.
inlineSecrets:
  app:
    enabled: false
    # -- env keys rendered into Secret <release>-app-env.
    # DOVEADM_PASSWORD is auto-derived from MAILFALLBACK_DOVECOT_API_KEY when absent.
    values: {}
    # -- extra metadata.annotations for the rendered Secret
    annotations: {}
  roundcube:
    enabled: false
    # -- env keys rendered into Secret <release>-roundcube-env.
    # ROUNDCUBEMAIL_DEFAULT_HOST/PORT are auto-derived when absent.
    values: {}
    annotations: {}

dovecot:
  image:
    repository: dovecot/dovecot
    # renovate: datasource=docker depName=dovecot/dovecot
    tag: 2.4.5

webmail:
  enabled: true
  # -- External hostname of the webmail (route + MAILFALLBACK_WEBMAIL_URL)
  hostname: ""
  image:
    repository: roundcube/roundcubemail
    # renovate: datasource=docker depName=roundcube/roundcubemail
    tag: 1.7.2-apache

tika:
  enabled: true
  image:
    repository: apache/tika
    # renovate: datasource=docker depName=apache/tika
    tag: 3.3.1.0-full

mcp:
  # -- expose the MCP server at /mcp (agent access over the Model Context Protocol)
  enabled: false
  # -- externally-reachable base URL MFB is served at (no path, no query string),
  # e.g. https://mfb.example.com. Required when mcp.enabled — without it MFB logs
  # an error at boot and does not mount /mcp.
  publicUrl: ""
  # -- reject any /mcp request whose Host/Origin isn't publicUrl's host. Turn off
  # only behind a reverse proxy that already validates Host AND terminates
  # browser-originated requests before they reach MFB — disabling this also skips
  # the Origin check, which a Host-validating proxy alone does not replace.
  dnsRebindingProtection: true

initImage:
  repository: docker.io/library/busybox
  # renovate: datasource=docker depName=docker.io/library/busybox
  tag: "1.38"

storage:
  maildirs:
    size: 20Gi
    storageClass: ""
    accessModes: [ReadWriteMany]
    # -- reuse an existing PVC (takes precedence over size/storageClass)
    existingClaim: ""
  maildirs2:
    enabled: false
    size: 10Gi
    storageClass: ""
    accessModes: [ReadWriteMany]
    existingClaim: ""
  dovecotConfd:
    size: 1Gi
    storageClass: ""
    accessModes: [ReadWriteMany]
    existingClaim: ""
  webmailConf:
    size: 1Gi
    storageClass: ""
    accessModes: [ReadWriteMany]
    existingClaim: ""

imaps:
  # -- expose IMAPS (31993) with TLS; sets MAILFALLBACK_DOVECOT_TLS and mounts the secret
  enabled: false
  # -- kubernetes.io/tls secret mounted at /etc/dovecot/ssl
  existingTlsSecret: ""
  # -- convenience cert-manager Certificate (creates existingTlsSecret's content)
  certificate:
    enabled: false
    secretName: mailfallback-imaps-tls  # pragma: allowlist secret
    issuerRef:
      name: ""
      kind: ClusterIssuer
    dnsNames: []
  service:
    type: LoadBalancer
    loadBalancerIP: ""
    annotations: {}

route:
  # -- Gateway API HTTPRoutes for the app (hostname) and webmail (webmail.hostname)
  enabled: false
  gateway:
    name: ""
    namespace: ""
  # -- Envoy Gateway SecurityPolicy pair opting the routes OUT of a gateway-level extAuth
  noSsoPolicy: false

resources:
  app:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 1Gi}
  dovecot:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 1Gi}
  webmail:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  tika:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
