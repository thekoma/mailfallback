{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-main
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ required "route.gateway.name is required" .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
  hostnames:
    - {{ required "hostname is required with route.enabled" .Values.hostname | quote }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: {{ include "mailfallback.appServiceName" . }}
          port: 8000
{{- if .Values.webmail.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-webmail
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
  hostnames:
    - {{ required "webmail.hostname is required with route.enabled + webmail.enabled" .Values.webmail.hostname | quote }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: {{ .Release.Name }}-webmail
          port: 80
{{- end }}
{{- end }}
