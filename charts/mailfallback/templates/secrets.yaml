{{- $app := .Values.inlineSecrets.app }}
{{- if $app.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mailfallback.appSecretName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with $app.annotations }}
  annotations:
    {{- range $k, $v := . }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- end }}
type: Opaque
stringData:
  {{- $vals := deepCopy $app.values }}
  {{- /* coupled-key derivation: doveadm auth reuses the dovecot API key (string copy — vault pointers survive) */}}
  {{- if and (hasKey $vals "MAILFALLBACK_DOVECOT_API_KEY") (not (hasKey $vals "DOVEADM_PASSWORD")) }}
  {{- $_ := set $vals "DOVEADM_PASSWORD" (get $vals "MAILFALLBACK_DOVECOT_API_KEY") }}
  {{- end }}
  {{- range $k, $v := $vals }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- $rc := .Values.inlineSecrets.roundcube }}
{{- if and $rc.enabled .Values.webmail.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mailfallback.roundcubeSecretName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with $rc.annotations }}
  annotations:
    {{- range $k, $v := . }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- end }}
type: Opaque
stringData:
  {{- $vals := deepCopy $rc.values }}
  {{- if not (hasKey $vals "ROUNDCUBEMAIL_DEFAULT_HOST") }}
  {{- $_ := set $vals "ROUNDCUBEMAIL_DEFAULT_HOST" (include "mailfallback.dovecotServiceName" $) }}
  {{- end }}
  {{- if not (hasKey $vals "ROUNDCUBEMAIL_DEFAULT_PORT") }}
  {{- $_ := set $vals "ROUNDCUBEMAIL_DEFAULT_PORT" "31143" }}
  {{- end }}
  {{- range $k, $v := $vals }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
