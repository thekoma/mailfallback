# Existing Prometheus: merge these blocks into its configuration.
# Put the MFB metrics token in /etc/prometheus/secrets/mfb-metrics-token.
scrape_configs:
  - job_name: mailfallback
    scrape_interval: 60s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/mfb-metrics-token
    static_configs:
      - targets: ['mailfallback:8000']
        labels:
          mfb_deployment: mailfallback/mailfallback
rule_files:
  - /etc/prometheus/mailfallback-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
