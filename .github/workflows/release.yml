name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      type:
        description: "Prerelease type (full releases go through the release PR)"
        type: choice
        options: [rc, beta]
        default: rc

permissions:
  contents: read

concurrency:
  group: release

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/thekoma/mailfallback

jobs:
  version:
    # Gira solo per: merge della release PR, oppure dispatch manuale (prerelease).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || 'main' }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(scripts/next_calver.sh --pre "${{ inputs.type }}")
            PRERELEASE=true
          else
            VERSION=$(grep -E '^__version__' src/mailfallback/version.py | grep -oE '"[^"]+"' | tr -d '"')
            echo "$VERSION" | grep -qE '^[0-9]{4}\.[0-9]{2}\.[0-9]+$' || { echo "version.py has no release version: $VERSION" >&2; exit 1; }
            PRERELEASE=false
          fi
          {
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "### Release ${VERSION} (prerelease=${PRERELEASE})" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}-${{ matrix.suffix }}
          build-args: |
            MFB_VERSION=${{ needs.version.outputs.version }}
            MFB_GIT_SHA=${{ needs.version.outputs.sha }}

  manifest:
    needs: [version, build]
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Create multi-arch manifest
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          PRERELEASE="${{ needs.version.outputs.prerelease }}"

          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${VERSION} \
            ${{ env.IMAGE }}:${VERSION}-amd64 \
            ${{ env.IMAGE }}:${VERSION}-arm64

          if [ "$PRERELEASE" = "false" ]; then
            docker buildx imagetools create \
              -t ${{ env.IMAGE }}:stable \
              -t ${{ env.IMAGE }}:latest \
              ${{ env.IMAGE }}:${VERSION}-amd64 \
              ${{ env.IMAGE }}:${VERSION}-arm64
          elif echo "$VERSION" | grep -qE '\-rc'; then
            docker buildx imagetools create \
              -t ${{ env.IMAGE }}:rc \
              ${{ env.IMAGE }}:${VERSION}-amd64 \
              ${{ env.IMAGE }}:${VERSION}-arm64
          fi

  chart:
    # Package + push the Helm chart to ghcr OCI PRIMA del tag (job release):
    # version == appVersion == CalVer risolta; un push fallito non lascia tag orfani.
    needs: [version, manifest]
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Login to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push
        run: |
          VER="${{ needs.version.outputs.version }}"
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts
          helm dependency build charts/mailfallback
          helm package charts/mailfallback --version "$VER" --app-version "$VER" -d /tmp/pkg
          helm push /tmp/pkg/mailfallback-"$VER".tgz oci://ghcr.io/thekoma/charts

  release:
    # Tag git + GitHub Release SOLO dopo che immagini, manifest e chart sono pushati:
    # un build fallito non lascia mai un tag orfano.
    needs: [version, manifest, chart]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION="${{ needs.version.outputs.version }}"
          SHA="${{ needs.version.outputs.sha }}"

          # Check if tag already exists
          if git rev-parse -q --verify "refs/tags/${VERSION}^{commit}" > /dev/null 2>&1; then
            EXISTING_SHA=$(git rev-parse "refs/tags/${VERSION}^{commit}")
            if [ "$EXISTING_SHA" = "$SHA" ]; then
              echo "Tag '${VERSION}' already exists at expected SHA ${SHA} — skipping create and push"
              exit 0
            else
              echo "ERROR: Tag '${VERSION}' already exists at SHA ${EXISTING_SHA}, but expected SHA ${SHA}" >&2
              exit 1
            fi
          fi

          # Tag doesn't exist, create and push
          git tag "$VERSION" "$SHA"
          git push origin "refs/tags/$VERSION"

      - name: Extract release notes
        if: needs.version.outputs.prerelease == 'false'
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: cliff.toml
          args: --current --strip all
        env:
          OUTPUT: release-notes.md

      - name: Create GitHub Release
        if: needs.version.outputs.prerelease == 'false'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          body_path: release-notes.md
          prerelease: false

      - name: Create GitHub Prerelease
        if: needs.version.outputs.prerelease == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          prerelease: true
          generate_release_notes: true
