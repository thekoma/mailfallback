name: Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: "Release type"
        type: choice
        options:
          - release
          - rc
          - beta
        default: release
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/thekoma/mailfallback

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            YEAR_MONTH="$(date +%Y).$(date +%-m)"
            TYPE="${{ inputs.type }}"

            LATEST=$(git tag -l "${YEAR_MONTH}.*" --sort=-v:refname | grep -vE '\-' | head -1)
            if [ -z "$LATEST" ]; then
              NEXT_INC=0
            else
              CURRENT_INC=$(echo "$LATEST" | awk -F. '{print $3}')
              NEXT_INC=$((CURRENT_INC + 1))
            fi
            BASE="${YEAR_MONTH}.${NEXT_INC}"

            if [ "$TYPE" = "release" ]; then
              VERSION="$BASE"
              PRERELEASE=false
            else
              LATEST_PRE=$(git tag -l "${BASE}-${TYPE}*" --sort=-v:refname | head -1)
              if [ -z "$LATEST_PRE" ]; then
                PRE_NUM=1
              else
                CURRENT_PRE=$(echo "$LATEST_PRE" | grep -oE '[0-9]+$')
                PRE_NUM=$((CURRENT_PRE + 1))
              fi
              VERSION="${BASE}-${TYPE}${PRE_NUM}"
              PRERELEASE=true
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${VERSION}"
            git push origin --tags

            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          else
            VERSION="${GITHUB_REF_NAME}"
            if echo "$VERSION" | grep -qE '\-(rc|beta|alpha)'; then
              PRERELEASE=true
            else
              PRERELEASE=false
            fi
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          fi

          echo "### Release" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Pre-release:** ${PRERELEASE}" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.version.outputs.version }}

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}-${{ matrix.suffix }}

  manifest:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Create multi-arch manifest
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          PRERELEASE="${{ needs.version.outputs.prerelease }}"

          # Version-specific tag
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${VERSION} \
            ${{ env.IMAGE }}:${VERSION}-amd64 \
            ${{ env.IMAGE }}:${VERSION}-arm64

          if [ "$PRERELEASE" = "false" ]; then
            # :stable alias for releases
            docker buildx imagetools create \
              -t ${{ env.IMAGE }}:stable \
              -t ${{ env.IMAGE }}:latest \
              ${{ env.IMAGE }}:${VERSION}-amd64 \
              ${{ env.IMAGE }}:${VERSION}-arm64
          else
            # :rc alias for release candidates
            if echo "$VERSION" | grep -qE '\-rc'; then
              docker buildx imagetools create \
                -t ${{ env.IMAGE }}:rc \
                ${{ env.IMAGE }}:${VERSION}-amd64 \
                ${{ env.IMAGE }}:${VERSION}-arm64
            fi
          fi

  release:
    needs: [version, manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
