name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/thekoma/mailfallback

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Lexicon check (advisory)
        run: bash scripts/lexicon-check.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Vendored assets match vendor.json
        run: python3 scripts/sync_vendor.py --check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Only the version we actually ship: docker/Dockerfile is
        # python:3.14-slim. Testing 3.12/3.13 exercised versions that never
        # reach a user while leaving the released one untested.
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Test
        run: uv run pytest tests/ -n auto -v --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: [lint, secrets, vendor, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Determine tag
        id: tag
        # PR runs have GITHUB_REF_NAME like "173/merge" — '/' is invalid in a
        # Docker tag, so swap it for '-'. Push runs ("main") are unaffected.
        run: echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: |
            MFB_GIT_SHA=${{ github.sha }}

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Add chart repos
        run: helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts
      - name: Dependency build
        # The bjw-s common library is fetched from GitHub Pages on every run;
        # a transient 503/timeout there should not fail CI. Retry with backoff.
        run: |
          for i in 1 2 3; do
            helm dependency build charts/mailfallback && break
            [ "$i" = 3 ] && exit 1
            echo "dependency build failed (attempt $i), retrying..."; sleep $((i * 10))
          done
      - name: Lint
        run: helm lint charts/mailfallback
      - name: Render assertions
        run: |
          pip install pyyaml
          python3 scripts/assert_chart_render.py
      - name: Kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          for f in minimal full existing-claims inline-secrets; do
            helm template mailfallback charts/mailfallback -n mailfallback -f charts/mailfallback/ci/${f}-values.yaml \
              | ./kubeconform -strict -ignore-missing-schemas -summary
          done
