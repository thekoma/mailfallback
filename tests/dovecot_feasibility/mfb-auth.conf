# mfb-auth.conf -- Dovecot 2.4 auth config for the feasibility test
#
# Static passdb (all users authenticate with "testpass")
# Lua userdb (calls mock MFB API for namespace extra-fields)

auth_mechanisms = plain
auth_allow_cleartext = yes

passdb static {
    password = testpass
}

userdb lua {
    lua_file = /etc/dovecot/lua-userdb.lua
}

# Disable SSL for this test
ssl = no
